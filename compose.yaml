---
x-common: &common
  restart: unless-stopped
  networks:
    default:

networks:
  default:

volumes:
  mariadb-data: {}
  omeka-s-files: {}

secrets:
  DB_ROOT_PASSWORD:
    file: ./secrets/DB_ROOT_PASSWORD
  OMEKA_S_DB_PASSWORD:
    file: ./secrets/OMEKA_S_DB_PASSWORD
  OMEKA_S_ADMIN_PASSWORD:
    file: ./secrets/OMEKA_S_ADMIN_PASSWORD

services:
  init:
    image: libops/base:3.2.2.0@sha256:dcbc45a6f61b41d6e849c8920ebca58f26cd65414b3efafbaabc5d04fa95af9d
    restart: no
    working_dir: /work
    environment:
      COMPOSE_FILE: /work/compose.yaml
      SECRETS_ROOT: /work/secrets
    volumes:
      - ./certs:/work/certs:rw,z
      - ./secrets:/work/secrets:rw,z
      - ./compose.yaml:/work/compose.yaml:ro,z
    entrypoint: generate-compose-secrets.sh
    profiles: [none]

  traefik:
    <<: *common
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=300s
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    depends_on:
      omeka-s:
        condition: service_healthy
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 10s

  omeka-s:
    <<: *common
    build:
      context: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INGRESS_HOSTNAMES: "localhost"
      INGRESS_SCHEME: "http"
      LIBOPS_SMTP_HOST: "${LIBOPS_SMTP_HOST:-host.docker.internal}"
      LIBOPS_SMTP_PORT: "${LIBOPS_SMTP_PORT:-25}"
      SMTP_FROM: "${SMTP_FROM:-}"
    secrets:
      - source: OMEKA_S_DB_PASSWORD
        target: DB_PASSWORD
      - source: OMEKA_S_ADMIN_PASSWORD
    volumes:
      - ./scripts/omeka-s-database-config.php:/usr/local/share/libops/sitectl-omeka-s-database-config.php:ro,z
      - ./scripts/omeka-s-rollout-migration-gate.sh:/usr/local/bin/sitectl-omeka-s-rollout-migration-gate:ro,z
      - ./scripts/omeka-s-rollout-readiness.sh:/usr/local/bin/sitectl-omeka-s-rollout-readiness:ro,z
      - ./scripts/omeka-s-verify-database.sh:/usr/local/bin/sitectl-omeka-s-verify-database:ro,z
      - ./scripts/omeka-s-verify-storage.sh:/usr/local/bin/sitectl-omeka-s-verify-storage:ro,z
      - ./scripts/omeka-s-verify.sql:/usr/local/share/libops/sitectl-omeka-s-verify.sql:ro,z
      - ./scripts/omeka-s-version.php:/usr/local/share/libops/sitectl-omeka-s-version.php:ro,z
      - omeka-s-files:/var/www/omeka-s/files:rw
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /installed && test -f /var/www/omeka-s/index.php && wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m

  database-init:
    image: libops/base:3.2.2.0@sha256:dcbc45a6f61b41d6e849c8920ebca58f26cd65414b3efafbaabc5d04fa95af9d
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: omeka_s
      DB_USER: omeka_s
      DB_CHARACTER_SET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: OMEKA_S_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    <<: *common
    image: libops/mariadb:11@sha256:23619b0490e895e79fd36c84fe2294107708a39bd64d06dabcd57c344c5a4620
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    secrets:
      - source: DB_ROOT_PASSWORD
